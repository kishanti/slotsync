version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: slotsync-mongo
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --eval "
        try {
          rs.status();
          print('Replica set already initiated');
        } catch (err) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
          print('Replica set initiated');
        }
        "
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - slotsync-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slotsync-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/slotsync?replicaSet=rs0
      - JWT_ACCESS_SECRET=your_access_secret_change_in_production
      - JWT_REFRESH_SECRET=your_refresh_secret_change_in_production
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=http://localhost:5173
      - BCRYPT_ROUNDS=12
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - slotsync-network

volumes:
  mongo_data:

networks:
  slotsync-network:
    driver: bridge
